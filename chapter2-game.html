<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食语侦探社｜未来美食命名实验室</title><style>:root{--red:#741c24;--gold:#e9b75a;--cream:#fff1cf;--dark:#24141b}*{box-sizing:border-box}body{margin:0;color:var(--cream);font-family:system-ui,'Microsoft YaHei',sans-serif;background:radial-gradient(circle at 80% 0%,#6c3445,transparent 45%),linear-gradient(135deg,#25151e,#591b27 60%,#24141b);min-height:100vh}.shell{max-width:860px;margin:auto;padding:22px 15px 45px}header{text-align:center;border:2px solid var(--gold);border-radius:20px;padding:18px 12px;background:#4c1723;box-shadow:0 0 24px #c8934e44}small{letter-spacing:2px;color:#f8d796}h1{font-size:clamp(26px,5vw,40px);margin:8px 0}h2{font-size:24px;margin:0 0 12px}.panel{border:2px solid #dca64e;border-radius:18px;background:#421a26e8;padding:22px;margin-top:18px;box-shadow:0 9px 25px #10080c66}.muted{color:#f0d6b0;line-height:1.7}.progress{display:flex;gap:8px;margin:18px 0}.progress span{height:8px;flex:1;background:#815b53;border-radius:8px}.progress .on{background:var(--gold)}button{font:inherit;cursor:pointer;border:2px solid var(--gold);border-radius:12px;padding:12px 15px;color:#fff2d2;background:#79232d;font-weight:700;transition:.15s}button:hover,button:focus-visible{background:#a3323c;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(#bf4b3d,#82212b);width:100%;margin-top:14px;font-size:18px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{min-height:76px}.choice.selected{background:#b27729;color:#21120e}.result{background:#2d4938;border:1px solid #d4bc71;padding:12px;border-radius:12px;margin-top:14px;line-height:1.65}.bad{background:#5b2831}.dish{font-size:65px;text-align:center;padding:15px}.stamp{width:180px;height:180px;border:8px double #e7b85f;background:#8e2631;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:18px auto;box-shadow:0 0 22px #f4b14b77;transform:rotate(-8deg)}.stamp b{font-size:26px}.stamp span{font-size:50px}.hidden{display:none}.tag{display:inline-block;border:1px solid #d9b06b;border-radius:30px;padding:5px 12px;margin:4px;color:#ffe6a7}.summary{font-size:17px;line-height:1.8}footer{text-align:center;color:#c7a77c;margin-top:24px;font-size:12px}@media(max-width:480px){.panel{padding:16px}.choices{gap:8px}.choice{padding:12px 6px;font-size:15px}}</style></head><body><main class="shell"><header><small>食语侦探社 · 第二章互动关卡</small><h1>🧪 未来美食命名实验室</h1><div>融合料理研发中心 · 创造名称 · 破解词语密码</div></header><div class="progress" id="progress"></div><section class="panel" id="screen"></section><footer>独立互动网页 · 支持手机触控 · 不需要安装软件</footer></main><script>
const screen=document.querySelector('#screen'),progress=document.querySelector('#progress');let stage=0,ingredient='',style='',answer=null,score=0,done=false;const quiz=[{q:'“参巴披萨”把参巴与披萨的名称组合成新菜名，属于哪一种现象？',opts:['新名称的创造','原有词语改变意义'],a:0,why:'它为融合料理创造了新的组合名称；但不能仅凭组合就断言已经成为广泛使用的固定词。'},{q:'“点心”在不同历史时期的使用范围和所指食物发生变化，更适合归入？',opts:['新名称的创造','原有词语的词义演变'],a:1,why:'“点心”是已有词语，其所指范围及使用语境随时代发展。'},{q:'“椰浆饭汉堡”把两个已有食物名称组合起来，主要体现？',opts:['复合命名与饮食创新','古语词义完全消失'],a:0,why:'名称的组合突出了两种饮食元素的融合，并不意味着旧词的意义消失。'}];function prog(){progress.innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<=stage?'on':''}"></span>`).join('')}function btn(t,fn,cls=''){let b=document.createElement('button');b.textContent=t;b.className=cls;b.onclick=fn;return b}function base(title,desc){screen.innerHTML=`<h2>${title}</h2><div class="muted">${desc}</div>`}function render(){prog();if(stage===0){base('实验室任务书','欢迎来到融合料理研发中心！你的任务是选取一种马来西亚风味与一种料理形式，研发一道融合美食，再通过三道语言侦探题，辨认「新名称」和「词义演变」的差别。');screen.append(btn('进入研发中心 →',()=>{stage=1;render()},'primary'))}else if(stage===1){base('第一步 · 选择马来西亚风味','从下列风味中选一个，作为你的料理灵感。');let d=document.createElement('div');d.className='choices';['🌶️ 参巴','🥥 椰浆饭','🍢 沙爹','🍈 榴莲'].forEach(x=>d.append(btn(x,()=>{ingredient=x;stage=2;render()},'choice')));screen.append(d)}else if(stage===2){base('第二步 · 选择料理形式',`已选风味：<strong>${ingredient}</strong>。现在选择一种料理形式，创造你的融合料理。`);let d=document.createElement('div');d.className='choices';['🍕 披萨','🍔 汉堡','🍝 意面','🥐 可颂'].forEach(x=>d.append(btn(x,()=>{style=x;stage=3;render()},'choice')));screen.append(d)}else if(stage===3){const clean=x=>x.replace(/^\S+\s*/, '');const name=clean(ingredient)+clean(style);base('研发成果 · 为新料理命名',`你创造了：<strong style="color:#ffdc8c;font-size:25px">${name}</strong><br>这是一个结合两种饮食元素的创意名称。它是本次实验室的构想，不代表现实中已有固定菜名。`);let e=document.createElement('div');e.className='dish';e.textContent=ingredient.split(' ')[0]+' + '+style.split(' ')[0];screen.append(e);screen.append(btn('进入词语辨认挑战 →',()=>{stage=4;answer=null;render()},'primary'))}else if(stage===4){let q=quiz[done?quiz.length-1:quizIndex];base(`第三步 · 语言侦探挑战（${quizIndex+1}/3）`,q.q);let d=document.createElement('div');d.className='choices';q.opts.forEach((x,i)=>{let b=btn(x,()=>{if(answer!==null)return;answer=i;if(i===q.a)score++;render()},'choice'+(answer===i?' selected':''));b.disabled=answer!==null;d.append(b)});screen.append(d);if(answer!==null){let r=document.createElement('div');r.className='result '+(answer===q.a?'':'bad');r.textContent=(answer===q.a?'✓ 判断正确！':'✕ 再记住这个区别：')+' '+q.why;screen.append(r);screen.append(btn(quizIndex===2?'查看结算与印章 →':'下一题 →',()=>{if(quizIndex<2){quizIndex++;answer=null;render()}else{stage=5;render()}},'primary'))}}else if(stage===5){base('任务结算 · 研发报告',`你答对了 <strong>${score} / 3</strong> 题。`);if(score===3){let s=document.createElement('div');s.className='stamp';s.innerHTML='<span>🧪</span><b>创新命名</b><small>第二枚线索印章</small>';screen.append(s);let p=document.createElement('p');p.className='summary';p.textContent='恭喜通关！新造名称着重于创造新的表达方式；词义演变则着重于已有词语的意义变化。两者并不完全相同。';screen.append(p)}else{let p=document.createElement('p');p.className='summary';p.textContent='还差一点！全部答对三道题，就能获得第二枚「创新命名」线索印章。';screen.append(p)}screen.append(btn('重新挑战 ↻',()=>{stage=0;ingredient='';style='';answer=null;score=0;quizIndex=0;render()},'primary'))}}let quizIndex=0;render();
</script></body></html>
